# ---------------------------------------------------------------------------
# DELIBERATELY MANUAL-ONLY.
#
# There is no `push:` or `pull_request:` trigger here, and that is intentional:
# this project has no GitHub Actions runners budgeted, so CI must never start
# by itself. The workflow exists so the pipeline is documented and reproducible,
# and so it can be run on demand from the Actions tab ("Run workflow").
#
# To enable automatic CI later, add:
#     push:
#       branches: [main]
#     pull_request:
# ---------------------------------------------------------------------------
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

      - name: Reference vs. ubc parity (reference leg only — no ubc binary in CI)
        run: uv run python scripts/parity_check.py data/needs.ubc.json

      - name: Benchmark smoke run
        run: uv run python bench/benchmark.py --sizes 1000 --repeat 1
        env:
          PYTHONPATH: src
